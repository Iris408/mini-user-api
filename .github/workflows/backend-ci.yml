name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_user_api_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mini_user_api_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_user_api_db
      SECRET_KEY: github-actions-test-secret      

    steps:
      # Step 1: checkout code  
      - name: Checkout code  
        uses: actions/checkout@v4

      # Step 2: setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: install dependencies
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # Step 4: check Python files compile 
      - name: Check Python syntax
        run: python3 -m compileall app

      - name: Check database URL scheme
        run: |
          python3 -c "import os; print(os.getenv('DATABASE_URL').split(':')[0])"
          python3 -c "from app.main import app; print('FastAPI app imported successfully')"  
